{% load static %}
<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}?v=2">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxfiy Pasport — VoltPass</title>
    <script src="/static/js/lucide.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-page);padding:20px;">
    <div class="card" style="max-width:480px;width:100%;text-align:center;padding:40px 28px;box-shadow:var(--shadow-lg);">
        <div style="width:72px;height:72px;border-radius:50%;background:rgba(245,158,11,0.15);color:var(--status-warning);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;">
            <i data-lucide="lock" style="width:36px;height:36px;"></i>
        </div>
        <h1 style="font-size:1.45rem;font-weight:800;margin-bottom:10px;color:var(--text-primary);">
            Raqamli pasport xususiy rejimda
        </h1>
        <p style="font-size:0.92rem;color:var(--text-muted);line-height:1.6;margin-bottom:24px;">
            Ushbu elektr ob'ekti pasporti hozircha faqat ro'yxatdan o'tgan mas'ul elektrik va ob'ekt egasi uchun ochiq.
        </p>
        <div style="display:flex;flex-direction:column;gap:10px;">
            <a href="{% url 'accounts:login' %}" class="btn btn--primary" style="width:100%;">
                <i data-lucide="log-in"></i> Mutaxassis sifatida kirish
            </a>
            <a href="{% url 'home' %}" class="btn btn--ghost" style="width:100%;">
                Bosh sahifaga qaytish
            </a>
        </div>
        <div style="margin-top:24px;border-top:1px solid var(--border-color);padding-top:16px;font-size:0.78rem;color:var(--text-muted);">
            ⚡ VoltPass · Electrical Digital Passport Security Protocol
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
