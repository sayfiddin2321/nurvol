{% extends "base.html" %}
{% block title %}Parol yangilandi — VoltPass{% endblock %}
{% block content_public %}
<div style="max-width:480px;margin:50px auto;padding:0 16px;">
    <div class="card" style="padding:40px 32px;text-align:center;box-shadow:var(--shadow-lg);">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;">
            <i data-lucide="check" style="width:34px;height:34px;"></i>
        </div>

        <h1 style="font-size:1.6rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:10px;color:var(--text-primary);">
            Parol muvaffaqiyatli o'zgartirildi
        </h1>
        <p style="font-size:0.92rem;color:var(--text-secondary);line-height:1.6;margin-bottom:28px;">
            Yangi parolingiz saqlandi. Endi yangi parol yordamida tizimga kirishingiz mumkin.
        </p>

        <a href="{% url 'accounts:login' %}" class="btn btn--primary btn--lg" style="width:100%;">
            <i data-lucide="log-in"></i> Tizimga kirish
        </a>
    </div>
</div>
{% endblock %}
